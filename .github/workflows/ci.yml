# Typecheck and production build. Contact email sending is not exercised here;
# RESEND_API_KEY is only required at runtime (Replit Secrets / production env).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run check
      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
