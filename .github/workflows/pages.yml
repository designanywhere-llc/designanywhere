# Build the Vite client as a static site and deploy to GitHub Pages.
# `configure-pages` enablement attempts to turn on Pages (Actions source)
# if it is not already configured.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Install dependencies
        run: npm ci
      - name: Build static site
        run: npm run build:client
        env:
          NODE_ENV: production
          # configure-pages sets this to `/` once the custom domain is active,
          # so assets load at the apex instead of /designanywhere/.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Include custom domain CNAME
        run: cp CNAME dist/public/CNAME
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
